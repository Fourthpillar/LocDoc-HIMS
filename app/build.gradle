plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

description = 'LockDoc Spring Boot Application - runnable module assembling common/pharmacy/outpatient'

dependencies {
    implementation project(':common')
    implementation project(':pharmacy')
    implementation project(':outpatient')

    // Actuator (health check)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Flyway - versioned DB migrations (H2 support ships inside flyway-core;
    // there is no separate flyway-database-h2 artifact)
    implementation 'org.flywaydb:flyway-core'

    // H2 file-based database
    runtimeOnly 'com.h2database:h2'

    // JWT runtime providers (jjwt-api is a compile-time dependency of common's JwtUtil)
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    testImplementation 'org.springframework.security:spring-security-test'
}

bootJar {
    archiveFileName = 'lockdoc-app.jar'
}

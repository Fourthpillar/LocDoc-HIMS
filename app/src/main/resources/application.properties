server.port=7321
server.servlet.context-path=/lockdoc

spring.application.name=lockdoc-app

# ---------------------------------------------------------------
# H2 File-based datasource (data persists to disk under ./data)
# ---------------------------------------------------------------
# NOTE: H2 rejects AUTO_SERVER=TRUE combined with DB_CLOSE_ON_EXIT=FALSE
# ("Feature not supported"), so only AUTO_SERVER is set here.
spring.datasource.url=jdbc:h2:file:./data/lockdocdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# schema is fully managed by Flyway versioned scripts, Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
# hibernate.dialect is intentionally not set - Hibernate resolves H2Dialect
# from the connection, and setting it explicitly triggers HHH90000025.

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ---------------------------------------------------------------
# Flyway - versioned scripts are split by module ownership:
#   - common: shared auth/user DDL + user bootstrap
#   - outpatient: patient DDL
#   - pharmacy: pharmacy DDL
#   - app: no SQL migrations remain; only db-scripts-overview.html documents the catalog
# ---------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/scripts/common,classpath:db/scripts/outpatient,classpath:db/scripts/pharmacy
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=true

# ---------------------------------------------------------------
# Actuator - application health check
# ---------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.health.diskspace.enabled=true

# ---------------------------------------------------------------
# Application specific configuration
# ---------------------------------------------------------------

# UI origins allowed to call this API
app.cors.allowed-origins[0]=http://localhost:5174
app.cors.allowed-origins[1]=http://localhost:5175
app.cors.allowed-origins[2]=http://localhost:5176

# Change this secret for production deployments (Base64 encoded, >= 256 bits)
app.security.jwt.secret=ZmFrZS1zdXBlci1zZWNyZXQta2V5LWZvci1sb2NrZG9jLWFwcC1jaGFuZ2UtbWU9MTIzNDU2Nzg5MA==
app.security.jwt.expiration-ms=3600000
app.security.jwt.issuer=lockdoc-app

# Any request whose path (relative to the context-path) matches one of
# these Ant-style patterns will bypass JWT validation.
app.security.jwt.excluded-urls[0]=/auth/login
app.security.jwt.excluded-urls[1]=/auth/refresh
app.security.jwt.excluded-urls[2]=/actuator/health
app.security.jwt.excluded-urls[3]=/actuator/health/**
app.security.jwt.excluded-urls[4]=/actuator/info
app.security.jwt.excluded-urls[5]=/h2-console
app.security.jwt.excluded-urls[6]=/h2-console/**
app.security.jwt.excluded-urls[7]=/v3/api-docs/**
app.security.jwt.excluded-urls[8]=/swagger-ui/**
app.security.jwt.excluded-urls[9]=/swagger-ui.html

logging.file.name=logs/lockdoc-app.log

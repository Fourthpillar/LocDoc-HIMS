plugins {
    id 'java-library'
}

description = 'Pharmacy module: suppliers, medicines/batches, purchase orders, purchases/GRN, sales, sales returns, inventory, reports'

dependencies {
    implementation project(':common')
    // Cross-module patient lookup goes through outpatient's PatientService bean only -
    // never reach into outpatient's Patient entity/repository directly.
    implementation project(':outpatient')
}

plugins {
    id 'org.springframework.boot' version '3.3.4' apply false
    id 'io.spring.dependency-management' version '1.1.6' apply false
}

description = 'LockDoc Spring Boot Application - JWT secured REST API with H2 file storage, split into common/pharmacy/outpatient/app Gradle modules'

allprojects {
    group = 'com.lockdoc'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

ext {
    jjwtVersion = '0.12.6'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:3.3.4"
        }
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }

    // Only the 'app' module has the Boot Gradle plugin applied, which is what
    // normally adds -parameters automatically - without it, @RequestParam name
    // binding (e.g. "int page" with no explicit name) breaks at runtime in the
    // other modules' controllers.
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << '-parameters'
    }
}

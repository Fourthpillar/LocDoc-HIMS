description = 'LockDoc common module - security/JWT, users, roles, facilities, doctors master data, platform (audit, support), shared exceptions and base DB scripts'

dependencies {
    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.boot:spring-boot-starter-security'
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'org.flywaydb:flyway-core'

    api "io.jsonwebtoken:jjwt-api:${rootProject.jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${rootProject.jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${rootProject.jjwtVersion}"
}
